name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: heirloom
          POSTGRES_PASSWORD: heirloom
          POSTGRES_DB: heirloom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heirloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://heirloom:heirloom@localhost:5432/heirloom_test
      HEIRLOOM_TEST_DATABASE_URL: postgres://heirloom:heirloom@localhost:5432/heirloom_test
      HEIRLOOM_TEST_ADMIN_URL: postgres://heirloom:heirloom@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
